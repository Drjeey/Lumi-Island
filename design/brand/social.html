<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:640px;background:#F2F2F7;font-family:Inter,"Segoe UI Variable Display","Segoe UI",sans-serif;color:#1C1C1E;overflow:hidden}
  .stage{position:relative;width:1280px;height:640px;overflow:hidden}
  .rings i{position:absolute;border-radius:50%;transform:translate(-50%,-50%);left:930px;top:330px}
  .copy{position:absolute;left:80px;top:96px}
  .tag{display:inline-flex;gap:10px;align-items:center;font-weight:600;font-size:22px;color:#6b6b72;background:#fff;border-radius:999px;padding:9px 20px;box-shadow:0 2px 10px #0001}

  h1{font-size:150px;line-height:.9;letter-spacing:-6px;font-weight:800;margin-top:26px}

  p{font-size:30px;line-height:1.3;color:#6b6b72;margin-top:24px;width:560px;font-weight:500}
  .island{position:absolute;left:740px;top:56px;width:380px;height:80px;border-radius:40px;background:#0c0c0e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-weight:600;font-size:27px;box-shadow:0 16px 36px #0003}
  .island .d{width:14px;height:14px;border-radius:50%;background:#F5B83D;margin-right:14px}
  .island .t{color:#FFE9B0;font-variant-numeric:tabular-nums}
  .lumi{position:absolute;left:700px;top:190px;width:460px;filter:drop-shadow(0 34px 30px #d9a98d66)}
  .skin{position:absolute;filter:drop-shadow(0 14px 14px #0002)}
</style>
